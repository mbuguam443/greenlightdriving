{% extends 'base.html' %}
{% block title %}Password Reset Complete - Green Light School{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-check-circle display-4 d-block mb-3" style="color:#2E7D32;"></i>
                <h5 style="color:#2E7D32;">Password Reset Complete</h5>
                <p class="text-muted">Your password has been set. Login with your new password.</p>
                <a href="{% url 'accounts:login' %}" class="btn text-white" style="background:#2E7D32;">Login Now</a>
            </div>
        </div>
    </div></div>
</div>
{% endblock %}
