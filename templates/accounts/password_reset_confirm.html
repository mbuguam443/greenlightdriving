{% extends 'base.html' %}
{% block title %}Set New Password - Green Light School{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header text-white text-center" style="background:#2E7D32;"><h5 class="mb-0">Set New Password</h5></div>
            <div class="card-body p-4">
                {% if validlink %}
                <form method="post">{% csrf_token %}
                    <div class="mb-3"><label class="form-label">New Password</label><input type="password" name="new_password1" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" name="new_password2" class="form-control" required></div>
                    <button type="submit" class="btn w-100 text-white" style="background:#2E7D32;">Reset Password</button>
                </form>
                {% else %}
                <p class="text-danger">Invalid or expired link. Request a new one.</p>
                <a href="{% url 'accounts:password_reset' %}" class="btn text-white" style="background:#2E7D32;">Try Again</a>
                {% endif %}
            </div>
        </div>
    </div></div>
</div>
{% endblock %}
