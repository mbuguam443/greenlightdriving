{% extends 'base.html' %}
{% block title %}Email Sent - Green Light School{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check display-4 d-block mb-3" style="color:#2E7D32;"></i>
                <h5 style="color:#2E7D32;">Check Your Email</h5>
                <p class="text-muted">If the email exists in our system, we've sent a password reset link. The email file is saved in the <code>sent_emails/</code> folder on the server.</p>
                <a href="{% url 'accounts:login' %}" class="btn text-white" style="background:#2E7D32;">Back to Login</a>
            </div>
        </div>
    </div></div>
</div>
{% endblock %}
