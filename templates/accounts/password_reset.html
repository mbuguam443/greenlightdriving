{% extends 'base.html' %}
{% block title %}Forgot Password - Green Light School{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-md-5">
        <div class="card border-0 shadow-sm">
            <div class="card-header text-white text-center" style="background:#2E7D32;"><h5 class="mb-0"><i class="bi bi-lock me-2"></i>Forgot Password</h5></div>
            <div class="card-body p-4">
                <p class="text-muted small">Enter your email address and we'll send you a link to reset your password.</p>
                <form method="post">{% csrf_token %}
                    <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Your email address" required></div>
                    <button type="submit" class="btn w-100 text-white" style="background:#2E7D32;">Send Reset Link</button>
                </form>
                <div class="text-center mt-3"><a href="{% url 'accounts:login' %}" style="color:#2E7D32;">Back to Login</a></div>
            </div>
        </div>
    </div></div>
</div>
{% endblock %}
