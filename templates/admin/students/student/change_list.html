{% extends "admin/change_list.html" %}
{% block object-tools-items %}
    <li>
        <form method="post" action="{% url 'admin:students_student_remind_all' %}"
              onsubmit="return confirm('Enable the payment reminder for ALL students with an outstanding balance?');"
              style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="addlink" style="background:#D32F2F;color:#fff;border:0;border-radius:4px;padding:6px 14px;cursor:pointer;font-size:12px;">
                Remind All
            </button>
        </form>
    </li>
    <li>
        <form method="post" action="{% url 'admin:students_student_clear_reminders' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" style="background:#6c757d;color:#fff;border:0;border-radius:4px;padding:6px 14px;cursor:pointer;font-size:12px;">
                Clear Reminders
            </button>
        </form>
    </li>
    {{ block.super }}
{% endblock %}
